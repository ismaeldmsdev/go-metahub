name: Datos de gimnasios

# Cada día comprueba si hay datos nuevos y los valida. Solo si han cambiado, todas las pruebas pasan y la variable del
# repositorio GIMNASIOS_AUTOMATICO vale «si», los guarda en main y lanza la publicación. Si algo falla, lo publicado se
# queda como está y GitHub avisa por correo.
# Para que siga comprobando sin publicar, se borra la variable. Para pararla: Actions › Datos de gimnasios › Disable workflow.
on:
  schedule:
    # 05:20 UTC: 06:20 en invierno y 07:20 en verano en la península. GitHub puede retrasarlo.
    - cron: '20 5 * * *'
  workflow_dispatch:
  # También al cambiar el generador o esta tarea, para comprobar que siguen funcionando.
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/gimnasios.yml']

permissions:
  contents: read

concurrency:
  group: gimnasios
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.datos.outputs.changed }}
      version: ${{ steps.datos.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Si los datos no cuadran, falla aquí y lo publicado se queda como está.
      - id: datos
        run: npm run gimnasios
      # Con los datos nuevos, antes de que lleguen a main: pruebas, compilación y aplicación completa en el navegador.
      - if: steps.datos.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          npm run test:e2e
      - if: steps.datos.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gimnasios
          path: public/data/gimnasios.json
          retention-days: 14

  publicar:
    needs: comprobar
    # Fuera del horario, aunque no haya nada que publicar, comprueba el permiso de escritura.
    if: >-
      (needs.comprobar.outputs.changed == 'true' && vars.GIMNASIOS_AUTOMATICO == 'si') ||
      github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      PUBLICAR: ${{ needs.comprobar.outputs.changed == 'true' && vars.GIMNASIOS_AUTOMATICO == 'si' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Comprobar el permiso de escritura, sin escribir nada
        run: |
          git push --dry-run origin HEAD:main
          echo "Publicación automática: ${{ vars.GIMNASIOS_AUTOMATICO == 'si' && 'activada' || 'desactivada (falta GIMNASIOS_AUTOMATICO=si)' }}" >> "$GITHUB_STEP_SUMMARY"
      - if: env.PUBLICAR == 'true'
        uses: actions/download-artifact@v8
        with:
          name: gimnasios
          path: public/data
      - name: Guardar los datos y lanzar la publicación
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.comprobar.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/gimnasios.json
          git commit -m "Actualizar los datos de gimnasios ($VERSION)"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
